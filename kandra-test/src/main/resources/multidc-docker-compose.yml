# Two-datacenter, one-node-per-DC Cassandra topology backing `KandraMultiDcTestcontainers`
# (GH #84 / ISS-076; ports made dynamic under GH #108/ISS-095 -- see that section below). See that
# class's KDoc for why this is scoped to 1 node per DC (2 containers total) rather than 2+ nodes per
# DC.
#
# Both services boot from the stock `cassandra:4.1` image (matching the single-node convention in
# `KandraTestcontainers`) -- everything needed for a genuine two-DC topology is expressible
# entirely through the image's own environment-variable contract (`docker-entrypoint.sh`, verified
# against the actual image for this fix): `CASSANDRA_DC` / `CASSANDRA_RACK` write
# `cassandra-rackdc.properties`, `CASSANDRA_ENDPOINT_SNITCH` selects `GossipingPropertyFileSnitch`
# (DC/rack-aware, required for `NetworkTopologyStrategy` to mean anything), and `CASSANDRA_SEEDS`
# points both nodes at `cassandra-dc1` so they gossip into one cluster instead of two independent
# single-node clusters that happen to share a Docker network.
#
# `cassandra-dc2` waits on `cassandra-dc1` being healthy (not just started) before its own
# container starts, so it never races dc1's gossip/native-transport bring-up -- gossip convergence
# across two real nodes is inherently slower than the single-node case, so generous
# healthcheck/startup timeouts are used throughout (see `KandraMultiDcTestcontainers` for the
# matching Testcontainers-side wait strategy timeouts).
#
# ## Why the host ports must still be 1:1 with each node's own native_transport_port
#
# A client connecting to *any* node in a Cassandra cluster discovers the rest of the ring via
# `system.peers`/`system.peers_v2` and then opens its own direct connections to those peers --
# there is no proxying through whichever node it first contacted. Testcontainers' single-node
# `CassandraContainer` never has to deal with this (no peers to discover), but a real 2-node
# cluster does: if peers advertise Docker's *internal* bridge-network address (the default), a
# client running on the host (outside that Docker network) can resolve the initial contact point
# fine but then fails to open connections to the discovered peer at all -- exactly the
# `NoNodeAvailableException`/`NotYetConnectedException` failure mode hit while building this
# fixture. `CASSANDRA_BROADCAST_RPC_ADDRESS=localhost` fixes the *address* half of that (each node
# advertises the address the host-side driver can actually reach), but Cassandra's peer discovery
# (`system.peers_v2`, protocol v5+) also advertises a per-node `native_port` taken directly from
# that node's own `native_transport_port` setting -- there is no separate "advertise a different
# port than I actually listen on" knob the way there is for the address. So each node's host-published
# port and its own `native_transport_port` must be identical, and the two nodes can't share one
# (both being reachable at `localhost`), for peer discovery to actually work from the host side.
#
# ## Why the port *numbers* are no longer hardcoded 9042/9043 (GH #108 / ISS-095)
#
# 9042 is the well-known default Cassandra/Scylla port -- a developer running this fixture is
# disproportionately likely to already have a local Cassandra/Scylla instance (or a concurrent run
# of this very fixture) bound to it, and a raw "port is already allocated" Docker error is not an
# actionable failure message. `KandraMultiDcTestcontainers` now picks two free ephemeral ports at
# fixture-startup time (one per DC, guaranteed distinct), passes them into `docker compose` as the
# `KANDRA_DC1_PORT`/`KANDRA_DC2_PORT` environment variables substituted below, and renders each
# node's own `native_transport_port` to match (see `multidc-cassandra-template.yaml`, mounted here
# for *both* nodes now, not just dc2) -- preserving the 1:1 host-port/native_transport_port
# requirement above while no longer colliding with anything already using 9042/9043. If the chosen
# ports still can't be bound (an inherent, small race between the free-port check and Docker
# actually claiming it) or Compose fails to start for any other reason,
# `KandraMultiDcTestcontainers.compose` wraps the failure in a `KandraMultiDcFixtureException` with
# an actionable message instead of surfacing a raw Testcontainers/Docker error.
services:
  cassandra-dc1:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: KandraMultiDcTest
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-dc1
      # See the file-level comment above -- lets a driver running on the host (outside this
      # compose network) actually reach this node once discovered as a peer, not just as the
      # initial contact point.
      CASSANDRA_BROADCAST_RPC_ADDRESS: localhost
    volumes:
      # Renders native_transport_port to KANDRA_DC1_PORT -- see the file-level comment above.
      - ./multidc-dc1-cassandra.yaml:/etc/cassandra/cassandra.yaml
    ports:
      # Fixed 1:1 (host port == container port) for the reason explained above; the *value* itself
      # is a dynamically-chosen free port (KANDRA_DC1_PORT), not a hardcoded default.
      - "${KANDRA_DC1_PORT}:${KANDRA_DC1_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 ${KANDRA_DC1_PORT} -e 'SELECT release_version FROM system.local' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  cassandra-dc2:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: KandraMultiDcTest
      CASSANDRA_DC: dc2
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      # Both nodes list dc1 as the seed -- dc2 joins the same cluster/gossip ring dc1 already
      # started, rather than the two nodes forming two separate single-node clusters.
      CASSANDRA_SEEDS: cassandra-dc1
      CASSANDRA_BROADCAST_RPC_ADDRESS: localhost
    volumes:
      # Renders native_transport_port to KANDRA_DC2_PORT -- see the file-level comment above.
      - ./multidc-dc2-cassandra.yaml:/etc/cassandra/cassandra.yaml
    ports:
      - "${KANDRA_DC2_PORT}:${KANDRA_DC2_PORT}"
    depends_on:
      cassandra-dc1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 ${KANDRA_DC2_PORT} -e 'SELECT release_version FROM system.local' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
