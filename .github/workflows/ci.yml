name: CI

on:
  push:
    branches: [ main, develop ]
    tags: ['v*']
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build and test
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # Ktor compatibility (GH #160). The `test` job runs the Ktor version pinned in
  # gradle/libs.versions.toml (3.6.0); this one re-runs the Ktor-facing modules against the newest
  # published Ktor 3.x and the previous minor line, so a Ktor-side change can't silently regress the claim.
  ktor-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ktor: [ '3.5.2', 'latest' ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Resolve Ktor version
        id: ktor
        run: |
          if [ "${{ matrix.ktor }}" = "latest" ]; then
            v=$(curl -fsS https://repo1.maven.org/maven2/io/ktor/ktor-server-core/maven-metadata.xml \
              | grep -oE '<version>3\.[0-9]+\.[0-9]+</version>' | sed -E 's/<[^>]+>//g' | sort -V | tail -1)
          else
            v="${{ matrix.ktor }}"
          fi
          echo "Testing against Ktor $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test Ktor-facing modules
        run: >
          ./gradlew :kandra-ktor:test :kandra-koin:test :kandra-kodein:test
          -PktorVersionOverride=${{ steps.ktor.outputs.version }} --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktor-compat-reports-${{ matrix.ktor }}
          path: '**/build/reports/tests/'

  publish:
    needs: [test, ktor-compat]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          # Deliberately no signingInMemoryKeyId: setting it breaks Gradle's key selection
          # against a single-key block ("Could not read PGP secret key") — confirmed locally.

  docs:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Generate Dokka docs
        run: ./gradlew dokkaHtmlMultiModule --no-daemon

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dokka/htmlMultiModule
          destination_dir: ${{ github.ref_name }}

      - name: Generate root redirect to latest version
        run: |
          mkdir -p redirect
          cat > redirect/index.html <<HTML
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Kandra Docs</title>
            <meta http-equiv="refresh" content="0; url=./${{ github.ref_name }}/">
            <link rel="canonical" href="./${{ github.ref_name }}/">
          </head>
          <body>
            <p>Redirecting to <a href="./${{ github.ref_name }}/">latest docs (${{ github.ref_name }})</a>&hellip;</p>
          </body>
          </html>
          HTML

      - name: Deploy root redirect to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect
          keep_files: true
